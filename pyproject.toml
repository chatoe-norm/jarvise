[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvise"
version = "0.1.0"
description = "Jarvise paper analytics + agent workspace CLI (no order placement)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "typer>=0.27.2",
  "cryptography>=44",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=6.0",
  "fastapi>=0.142.1",
  "httpx>=0.28.1",
  "python-multipart>=0.0.32",
  "ruff>=0.14",
  "mypy>=1.14",
  "pip-audit>=2.9",
]
rag = [
  "qdrant-client>=1.19.1",
  "sentence-transformers>=5.6.0",
  "redis>=6.0,<9",
]
web = [
  "fastapi>=0.142.1",
  "uvicorn[standard]>=0.54.0",
  "python-multipart>=0.0.32",
  "redis>=6.0,<9",
  "qdrant-client>=1.19.1",
]

[project.scripts]
jarvise = "jarvise.cli:app"
jarvise-ingest = "jarvise_ingest.cli:main"
jarvise-analyze = "jarvise_analyze.cli:main"
jarvise-paper = "jarvise_paper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = false
omit = ["src/*/__main__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = false

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Correctness + import hygiene + modern syntax. Style-only rules stay off so CI gates on bugs, not taste.
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long lines are a formatting concern; B008: Typer/FastAPI Depends/Option defaults are idiomatic;
# UP042: `class X(str, Enum)` is what Typer expects for choice options on Python 3.11.
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
# Gate on real type errors without forcing annotations across the codebase yet.
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
exclude = ["src/jarvise_web/static"]
