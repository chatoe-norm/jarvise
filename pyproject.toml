[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvise"
version = "0.1.0"
description = "Jarvise paper analytics + agent workspace CLI (no order placement)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "typer>=0.27.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "fastapi>=0.141.1", "httpx>=0.28.1", "python-multipart>=0.0.32"]
rag = [
  "qdrant-client>=1.19.1",
  "sentence-transformers>=5.1.2",
  "redis>=6.0,<9",
]
web = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.53.0",
  "python-multipart>=0.0.32",
  "redis>=6.0,<9",
  "qdrant-client>=1.19.1",
]

[project.scripts]
jarvise = "jarvise.cli:app"
jarvise-ingest = "jarvise_ingest.cli:main"
jarvise-analyze = "jarvise_analyze.cli:main"
jarvise-paper = "jarvise_paper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
