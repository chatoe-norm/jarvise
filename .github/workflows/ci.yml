name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff format --check src tests scripts
      - run: ruff check src tests scripts
      - run: mypy

  test:
    name: pytest (coverage gate 70%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --cov=src --cov-report=term --cov-fail-under=70

  audit:
    name: pip-audit (locked runtime deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install pip-audit
      # Locks are fully pinned (uv pip compile --generate-hashes); audit the pins directly so the
      # linux-only CUDA wheels in worker.lock are not re-resolved by pip on the runner.
      - run: pip-audit --strict --disable-pip -r requirements/worker.lock
      - run: pip-audit --strict --disable-pip -r requirements/web.lock

  web:
    name: web build (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    name: docker images (worker + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build worker image
        run: docker build -f infra/docker/Dockerfile.worker -t jarvise-worker:ci .
      - name: Build web image
        run: docker build -f infra/docker/Dockerfile.web -t jarvise-web:ci .
