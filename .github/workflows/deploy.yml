name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, Linux, jarvise]
    timeout-minutes: 40
    steps:
      - name: Rebuild the paper stack
        run: sudo /opt/jarvise/infra/deploy/vps-deploy.sh
