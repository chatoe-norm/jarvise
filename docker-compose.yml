# Jarvise background plane — Redis, Qdrant RAG, n8n, worker, OpenClaw, control web
# Paper analytics / research only. No order placement / live trading.
#
# Dev (default): ports on 127.0.0.1
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

name: jarvise

services:
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    networks: [jarvise_net]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - jarvise_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    networks: [jarvise_net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - jarvise_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  n8n:
    image: n8nio/n8n:2.40.0
    restart: unless-stopped
    networks: [jarvise_net]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      # Tailscale / private HTTP: secure cookies require HTTPS or localhost.
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - WEBHOOK_URL=http://127.0.0.1:${N8N_PORT:-5678}/
      - GENERIC_TIMEZONE=Asia/Bangkok
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-jarvise}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-change-me}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JARVISE_ROOT=/host/jarvise
      - JARVISE_PAPER_ONLY=true
    volumes:
      - jarvise_n8n:/home/node/.n8n
      - ./infra/n8n/workflows:/workflows:ro
      - .:/host/jarvise:ro
    depends_on:
      redis:
        condition: service_healthy
      jobs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
      args:
        JARVISE_UID: ${JARVISE_UID:-1000}
        JARVISE_GID: ${JARVISE_GID:-1000}
    image: jarvise-worker:local
    restart: "no"
    networks: [jarvise_net]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 2500m
    cpus: 1.5
    pids_limit: 256
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - BINANCE_API_PRIVATE_KEY_PATH=${BINANCE_API_PRIVATE_KEY_PATH:-}
      - BINANCE_API_PRIVATE_KEY_PASSPHRASE=${BINANCE_API_PRIVATE_KEY_PASSPHRASE:-}
      - JARVISE_PAPER_ONLY=true
      - JARVISE_ROOT=/app
      - NLM_PROFILE=${NLM_PROFILE:-chatoe}
      - NOTEBOOKLM_MCP_CLI_PATH=/home/jarvise/.nlm
      - HF_HOME=/app/data/.cache/hf
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./secrets:/opt/jarvise/secrets:ro
      - ${NLM_HOME:-./data/nlm}:/home/jarvise/.nlm
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    profiles: ["tools"]

  jobs:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
      args:
        JARVISE_UID: ${JARVISE_UID:-1000}
        JARVISE_GID: ${JARVISE_GID:-1000}
    image: jarvise-worker:local
    restart: unless-stopped
    networks: [jarvise_net]
    command: ["python", "-m", "jarvise.jobs"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 2500m
    cpus: 1.5
    pids_limit: 512
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
      - COINGECKO_DEMO_API_KEY=${COINGECKO_DEMO_API_KEY:-}
      - COINGECKO_PRO_API_KEY=${COINGECKO_PRO_API_KEY:-}
      - COINGECKO_ENVIRONMENT=${COINGECKO_ENVIRONMENT:-}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - BINANCE_API_PRIVATE_KEY_PATH=${BINANCE_API_PRIVATE_KEY_PATH:-}
      - BINANCE_API_PRIVATE_KEY_PASSPHRASE=${BINANCE_API_PRIVATE_KEY_PASSPHRASE:-}
      - JARVISE_PAPER_ONLY=true
      - JARVISE_LIVE_TRADING=${JARVISE_LIVE_TRADING:-false}
      - JARVISE_ROOT=/app
      - JARVISE_PAPER_UNIVERSE=${JARVISE_PAPER_UNIVERSE:-paper_core}
      - JARVISE_INGEST_SYMBOLS=${JARVISE_INGEST_SYMBOLS:-BTCUSDT,ETHUSDT}
      - JARVISE_PAPER_TIMEFRAME=${JARVISE_PAPER_TIMEFRAME:-4h}
      - JARVISE_APPROVAL_TIMEOUT_MIN=${JARVISE_APPROVAL_TIMEOUT_MIN:-60}
      - JARVISE_INGEST_HEALTH_MAX_AGE_MIN=${JARVISE_INGEST_HEALTH_MAX_AGE_MIN:-60}
      - JARVISE_PAPER_AUTO_DECIDE=${JARVISE_PAPER_AUTO_DECIDE:-false}
      - JARVISE_AUTO_DECIDE_MODEL=${JARVISE_AUTO_DECIDE_MODEL:-anthropic/claude-sonnet-5.5}
      - JARVISE_AUTO_DECIDE_MIN_CONF=${JARVISE_AUTO_DECIDE_MIN_CONF:-0.55}
      - JARVISE_AUTO_DECIDE_MAX_PER_RUN=${JARVISE_AUTO_DECIDE_MAX_PER_RUN:-4}
      - JARVISE_AUTO_DECIDE_TIMEOUT_S=${JARVISE_AUTO_DECIDE_TIMEOUT_S:-30}
      - JARVISE_AUTO_DECIDE_MIN_EV=${JARVISE_AUTO_DECIDE_MIN_EV:-}
      - JARVISE_AUTO_DECIDE_MIN_EV_N=${JARVISE_AUTO_DECIDE_MIN_EV_N:-10}
      - JARVISE_ANALYZE_MTF=${JARVISE_ANALYZE_MTF:-true}
      - JARVISE_ANALYZE_HTF=${JARVISE_ANALYZE_HTF:-1d}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - JARVISE_MAX_NOTIONAL_PER_ORDER=${JARVISE_MAX_NOTIONAL_PER_ORDER:-2000}
      - JARVISE_MAX_DAILY_LOSS_USD=${JARVISE_MAX_DAILY_LOSS_USD:-100}
      - JARVISE_DRAWDOWN_LOCK_PCT=${JARVISE_DRAWDOWN_LOCK_PCT:-5}
      - JARVISE_MAX_OPEN_POSITIONS=${JARVISE_MAX_OPEN_POSITIONS:-2}
      - JARVISE_MAX_GROSS_NOTIONAL_PCT=${JARVISE_MAX_GROSS_NOTIONAL_PCT:-10}
      - JARVISE_MAX_SYMBOL_NOTIONAL_PCT=${JARVISE_MAX_SYMBOL_NOTIONAL_PCT:-6}
      - JARVISE_MAX_CORRELATED_BUCKET_PCT=${JARVISE_MAX_CORRELATED_BUCKET_PCT:-10}
      - NLM_PROFILE=${NLM_PROFILE:-chatoe}
      - NOTEBOOKLM_MCP_CLI_PATH=/home/jarvise/.nlm
      - HF_HOME=/app/data/.cache/hf
      - JARVISE_HTTP_RETRIES=${JARVISE_HTTP_RETRIES:-3}
      - JARVISE_JOBS_TOKEN=${JARVISE_JOBS_TOKEN:-}
      - JOBS_PORT=8090
      - JARVISE_DB=${JARVISE_DB:-/app/data/analytics/jarvise.db}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - BINANCE_TRADE_API_KEY=${BINANCE_TRADE_API_KEY:-}
      - BINANCE_TRADE_API_SECRET=${BINANCE_TRADE_API_SECRET:-}
      - BINANCE_TRADE_PRIVATE_KEY_PATH=${BINANCE_TRADE_PRIVATE_KEY_PATH:-}
      - BINANCE_TRADE_PRIVATE_KEY_PASSPHRASE=${BINANCE_TRADE_PRIVATE_KEY_PASSPHRASE:-}
      - JARVISE_LIVE_EQUITY_USD=${JARVISE_LIVE_EQUITY_USD:-}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./secrets:/opt/jarvise/secrets:ro
      - ${NLM_HOME:-./data/nlm}:/home/jarvise/.nlm
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  openclaw:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.9.5}
    restart: unless-stopped
    networks: [jarvise_net]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    # The gateway holds an owner lease in its state dir; a SIGKILL after the default 10s leaves it
    # stale and the next start loops "lease still active" for minutes. Give it time to drain.
    stop_grace_period: 90s
    ports:
      - "127.0.0.1:${OPENCLAW_PORT:-18789}:18789"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENCLAW_PAPER_ONLY=true
      - JARVISE_PAPER_ONLY=true
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - OPENCLAW_GATEWAY_BIND=lan
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
    volumes:
      - ./data/openclaw:/home/node/.openclaw
      - ./config/openclaw:/config:ro
      - ./plugins/jarvise-openclaw:/plugins/jarvise-openclaw:ro
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      # OPENCLAW_GATEWAY_BIND=lan does not listen on 127.0.0.1 — probe first non-loopback IPv4.
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const os=require('os');let ip='127.0.0.1';for(const list of Object.values(os.networkInterfaces()||{})){for(const i of list||[]){if((i.family==='IPv4'||i.family===4)&&!i.internal){ip=i.address;break;}}}http.get('http://'+ip+':18789/',r=>{r.resume();process.exit(r.statusCode&&r.statusCode<500?0:1)}).on('error',()=>process.exit(1));\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        JARVISE_UID: ${JARVISE_UID:-1000}
        JARVISE_GID: ${JARVISE_GID:-1000}
    image: jarvise-web:local
    restart: unless-stopped
    networks: [jarvise_net]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - JARVISE_PAPER_ONLY=true
      - JARVISE_LIVE_TRADING=${JARVISE_LIVE_TRADING:-false}
      - JARVISE_DB=/data/analytics/jarvise.db
      - JARVISE_MAX_NOTIONAL_PER_ORDER=${JARVISE_MAX_NOTIONAL_PER_ORDER:-2000}
      - JARVISE_MAX_DAILY_LOSS_USD=${JARVISE_MAX_DAILY_LOSS_USD:-100}
      - JARVISE_DRAWDOWN_LOCK_PCT=${JARVISE_DRAWDOWN_LOCK_PCT:-5}
      - JARVISE_MAX_OPEN_POSITIONS=${JARVISE_MAX_OPEN_POSITIONS:-2}
      - JARVISE_MAX_GROSS_NOTIONAL_PCT=${JARVISE_MAX_GROSS_NOTIONAL_PCT:-10}
      - JARVISE_MAX_SYMBOL_NOTIONAL_PCT=${JARVISE_MAX_SYMBOL_NOTIONAL_PCT:-6}
      - JARVISE_MAX_CORRELATED_BUCKET_PCT=${JARVISE_MAX_CORRELATED_BUCKET_PCT:-10}
      - JARVISE_ANALYZE_MTF=${JARVISE_ANALYZE_MTF:-true}
      - JARVISE_ANALYZE_HTF=${JARVISE_ANALYZE_HTF:-1d}
      - WEB_BASIC_AUTH_USER=${WEB_BASIC_AUTH_USER:-}
      - WEB_BASIC_AUTH_PASSWORD=${WEB_BASIC_AUTH_PASSWORD:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-jarvise_doctrine}
      - JARVISE_JOBS_URL=${JARVISE_JOBS_URL:-http://jobs:8090}
      - JARVISE_JOBS_TOKEN=${JARVISE_JOBS_TOKEN:-}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - BINANCE_API_PRIVATE_KEY_PATH=${BINANCE_API_PRIVATE_KEY_PATH:-}
      - BINANCE_API_PRIVATE_KEY_PASSPHRASE=${BINANCE_API_PRIVATE_KEY_PASSPHRASE:-}
      - BINANCE_TRADE_API_KEY=${BINANCE_TRADE_API_KEY:-}
      - BINANCE_TRADE_API_SECRET=${BINANCE_TRADE_API_SECRET:-}
      - BINANCE_TRADE_PRIVATE_KEY_PATH=${BINANCE_TRADE_PRIVATE_KEY_PATH:-}
      - BINANCE_TRADE_PRIVATE_KEY_PASSPHRASE=${BINANCE_TRADE_PRIVATE_KEY_PASSPHRASE:-}
      - JARVISE_LIVE_EQUITY_USD=${JARVISE_LIVE_EQUITY_USD:-}
    volumes:
      - ./data/analytics:/data/analytics
      - ./secrets:/opt/jarvise/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Lean observability (T2.4). Opt-in: docker compose --profile obs up -d
  # Bind 127.0.0.1 / Tailscale only — never public IPv4. Keep mem limits for T4Trip.
  prometheus:
    profiles: [obs]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    networks: [jarvise_net]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - jarvise_prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    depends_on:
      - web
      - jobs

  grafana:
    profiles: [obs]
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    networks: [jarvise_net]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-jarvise}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change-me}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://127.0.0.1:3000}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - jarvise_grafana:/var/lib/grafana
    depends_on:
      - prometheus

networks:
  jarvise_net:
    driver: bridge

volumes:
  jarvise_redis:
  jarvise_qdrant:
  jarvise_n8n:
  jarvise_prometheus:
  jarvise_grafana:
